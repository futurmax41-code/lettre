<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pour toi ❤️</title>

<style>
body{
  margin:0;
  font-family:'Comic Sans MS', cursive;
  background: radial-gradient(circle,#ffccd9,#ff99cc);
  color:white;
  text-align:center;
  overflow-x:hidden;
}

#welcome{
  position:fixed;
  inset:0;
  background: radial-gradient(circle,#ff99cc,#ff66aa);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:999;
  transition:0.8s;
}
#welcome.hide{opacity:0; pointer-events:none;}

.btn{
  background: linear-gradient(45deg,#ff99cc,#ff66aa);
  border:none;border-radius:40px;color:white;
  padding:14px 28px;margin:8px;font-size:16px;
  box-shadow:0 0 15px #ff66aa;cursor:pointer;
}
.btn:hover{ transform:scale(1.08); }

.padlock{ font-size:80px;margin:20px;transition:0.4s; }
.unlock{ transform:scale(1.2) rotate(10deg); text-shadow:0 0 25px #ff66aa; }

.code{ display:flex; gap:12px; justify-content:center; margin:20px; }

.num{
  width:60px;height:60px;border-radius:15px;
  background:rgba(255,255,255,0.25);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;cursor:pointer;
}

#timer{ margin-top:8px; font-weight:bold; }
</style>
</head>
<body>

<div id="welcome">
  <h1>💌 J’ai quelque chose à te dire…</h1>
  <p>Mais tu dois d’abord débloquer mon cœur 😏❤️</p>
  <button class="btn" onclick="startGame()">Commencer 💕</button>
</div>

<h1>💖 Débloque mon cœur 💖</h1>

<div>
  <button class="btn" onclick="revealHint('bus')">🚌 Ligne de bus</button>
  <button class="btn" onclick="revealHint('blaze')">😏 Blaze Valence</button>
  <button class="btn" onclick="revealHint('insta')">📱 Ancien Insta</button>
  <button class="btn" onclick="revealHint('jeu')">🎮 Jeu préféré</button>
  <button class="btn" onclick="ultimate()">💎 Question ultime</button>

  <p id="hintStatus"></p>
  <p id="timer"></p>
</div>

<div id="indices">
  <p id="indice1">Indice 1 : 🔒</p>
  <p id="indice2">Indice 2 : 🔒</p>
  <p id="indice3">Indice 3 : 🔒</p>
  <p id="indice4">Indice 4 : 🔒</p>
</div>

<div class="padlock">🔒</div>

<div class="code">
  <div class="num" onclick="next(this)">0</div>
  <div class="num" onclick="next(this)">0</div>
  <div class="num" onclick="next(this)">0</div>
  <div class="num" onclick="next(this)">0</div>
  <div class="num" onclick="next(this)">0</div>
</div>

<button class="btn" onclick="checkCode()">Vérifier 💕</button>
<p id="status"></p>

<script>
function startGame(){
  document.getElementById("welcome").classList.add("hide");
}

const codeFinal="07083";

/* 🔐 stockage persistant */
let lockUntil=parseInt(localStorage.getItem("lockUntil")||"0");
let ultimateFails=parseInt(localStorage.getItem("ultimateFails")||"0");

/* 🧠 util */
function normalize(t){ return t.toLowerCase().trim(); }

/* ⏱️ TIMER */
function updateTimer(){
  const el=document.getElementById("timer");

  if(Date.now()>=lockUntil){
    el.textContent="";
    return;
  }

  const diff=Math.floor((lockUntil-Date.now())/1000);
  const m=Math.floor(diff/60);
  const s=diff%60;
  el.textContent=`⏳ Attends ${m}:${s<10?'0':''}${s}`;
}
setInterval(updateTimer,500);

/* ❌ lock 10 min */
function lock10min(){
  lockUntil=Date.now()+10*60*1000;
  localStorage.setItem("lockUntil",lockUntil);
}

/* 💀 lock ultime progressif */
function lockUltimate(){
  ultimateFails++;
  localStorage.setItem("ultimateFails",ultimateFails);

  let wait;
  if(ultimateFails===1) wait=1;
  else if(ultimateFails===2) wait=5;
  else wait=10;

  lockUntil=Date.now()+wait*60*60*1000;
  localStorage.setItem("lockUntil",lockUntil);
}

/* 🎯 QUESTIONS */
function revealHint(type){
  if(Date.now()<lockUntil){
    document.getElementById("hintStatus").textContent="⏳ Attends mon cœur";
    return;
  }

  let ok=false;

  if(type==="bus"){
    ok=normalize(prompt("Ligne de bus ?"))==="l10";
    if(ok) indice1.textContent="Indice 1 : 0";
  }

  if(type==="blaze"){
    const a=normalize(prompt("Blaze Valence ?"));
    ok=(a==="rk klm"||a==="klm rk");
    if(ok) indice2.textContent="Indice 2 : 7";
  }

  if(type==="insta"){
    ok=normalize(prompt("Ancien insta ?"))==="rk.klm";
    if(ok) indice3.textContent="Indice 3 : 0";
  }

  if(type==="jeu"){
    ok=normalize(prompt("Jeu préféré ?"))==="rocket league";
    if(ok) indice4.textContent="Indice 4 : 8";
  }

  if(ok){
    hintStatus.textContent="✅ Bien joué ❤️";
  }else{
    hintStatus.textContent="❌ Mauvaise réponse";
    lock10min();
  }
}

/* 💎 ULTIME */
function ultimate(){
  if(Date.now()<lockUntil){
    hintStatus.textContent="⏳ Patience 😈";
    return;
  }

  const ans=normalize(prompt(`🧠 Question ultime

A) RFST
B) RSST
C) RSKT
D) RFTS
E) SRST
F) RRST
G) RSFT
H) RTSS
I) RSSS
J) RSTS`));

  if(ans==="rsst"){
    indice1.textContent="Indice 1 : 0";
    indice2.textContent="Indice 2 : 7";
    indice3.textContent="Indice 3 : 0";
    indice4.textContent="Indice 4 : 8";
    hintStatus.textContent="💖 Tous révélés !";
  }else{
    hintStatus.textContent="💀 Mauvais choix";
    lockUltimate();
  }
}

/* 🔢 cadenas */
function next(el){
  el.textContent=(parseInt(el.textContent)+1)%10;
}

function checkCode(){
  let code="";
  document.querySelectorAll(".num").forEach(n=>code+=n.textContent);

  if(code===codeFinal){
    document.querySelector(".padlock").textContent="🔓";
    setTimeout(()=>location.href="sorpresa.html",1200);
  }else{
    status.textContent="Essaie encore 😘";
  }
}
</script>

</body>
</html>
