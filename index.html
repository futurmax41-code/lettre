<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Pour Ma Princesse ❤️</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>💖 Bienvenue mon amour 💖</h1>

<div id="passwordBox">
<input type="password" id="password" placeholder="Code secret">
<button onclick="checkPassword()">Entrer</button>
</div>

<div id="quiz" style="display:none;">
<h2>🎯 Question ultime</h2>

<p>
Mélange mes passions (jeu préféré, fast-food préféré,
réseau social préféré, ville) — quelle combinaison est correcte ?
</p>

<div class="choices">
<button onclick="answer(false)">RFST</button>
<button onclick="answer(false)">RSFT</button>
<button onclick="answer(true)">RFSS</button>
<button onclick="answer(false)">FFSR</button>
<button onclick="answer(false)">TSRF</button>
<button onclick="answer(false)">SRRF</button>
<button onclick="answer(false)">FRSS</button>
<button onclick="answer(false)">RRFS</button>
<button onclick="answer(false)">SFRR</button>
<button onclick="answer(false)">TRFS</button>
</div>

<div id="timer"></div>

</div>

</div>

<audio id="music" loop>
<source src="https://cdn.pixabay.com/audio/2022/03/15/audio_9f6c0d5a9f.mp3">
</audio>

<script>
let attempts = 0;
let lockUntil = 0;

function checkPassword() {
  const pass = document.getElementById("password").value;
  if (pass === "07083") {
    document.getElementById("passwordBox").style.display = "none";
    document.getElementById("quiz").style.display = "block";
    document.getElementById("music").play();
  } else {
    alert("❌ Mauvais code mon cœur");
  }
}

function answer(correct) {
  const now = Date.now();

  if (now < lockUntil) {
    alert("⏳ Attends la fin du timer !");
    return;
  }

  if (correct) {
    window.location.href = "surprise.html";
  } else {
    attempts++;

    let waitHours = [1,5,10,24,72];
    let wait = waitHours[Math.min(attempts-1, waitHours.length-1)];

    lockUntil = now + wait*60*60*1000;
    startTimer();
  }
}

function startTimer() {
  const timer = document.getElementById("timer");

  const interval = setInterval(() => {
    const now = Date.now();
    const diff = lockUntil - now;

    if (diff <= 0) {
      timer.innerHTML = "";
      clearInterval(interval);
      return;
    }

    const h = Math.floor(diff/1000/60/60);
    const m = Math.floor(diff/1000/60)%60;
    const s = Math.floor(diff/1000)%60;

    timer.innerHTML =
      `⏳ Attente : ${h}h ${m}m ${s}s`;
  },1000);
}
</script>

</body>
</html>
