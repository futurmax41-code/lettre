<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💖 Surprise Royale 💖</title>
<style>
body {
  margin:0;
  height:100vh;
  font-family:'Comic Sans MS', cursive;
  background: radial-gradient(circle,#ffccdd,#ff99cc);
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  position:relative;
}

/* Table royale */
.table {
  position:relative;
  width:90%;
  max-width:700px;
  height:400px;
  background: linear-gradient(to bottom,#b88d60,#a67c52);
  border-radius:20px;
  box-shadow:0 0 50px rgba(0,0,0,0.5);
  display:flex;
  justify-content:center;
  align-items:flex-start;
}

/* Bouquet stylisé avec 100 roses CSS */
.bouquet {
  position:relative;
  width:120px;
  height:160px;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:center;
  cursor:default;
}
.bouquet span {
  width:12px;
  height:12px;
  background:red;
  border-radius:50%;
  margin:1px;
  box-shadow:0 0 4px rgba(0,0,0,0.3);
}

/* Enveloppe royale */
.enveloppe {
  position:absolute;
  width:50px;
  height:35px;
  top:-30px;
  left:50%;
  transform:translateX(-50%);
  background: gold;
  border:2px solid #fff;
  border-radius:5px;
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
  font-size:20px;
}

/* Lettre royale */
.lettre {
  position:absolute;
  top:50%;
  left:50%;
  width:80%;
  max-width:500px;
  transform:translate(-50%,-50%) scale(0);
  background: linear-gradient(to bottom, #fff8dc, #ffe4b5);
  border:2px solid gold;
  border-radius:15px;
  padding:20px;
  text-align:center;
  font-size:18px;
  color:#444;
  z-index:10;
  box-shadow:0 0 30px rgba(0,0,0,0.5);
  transition: transform 0.6s ease, opacity 0.6s ease;
  opacity:0;
}

/* Afficher lettre */
.lettre.show {
  transform:translate(-50%,-50%) scale(1);
  opacity:1;
}

/* Cœurs tombants */
.heart {
  position:absolute;
  font-size:20px;
  animation:fall 5s linear forwards;
}
@keyframes fall {
  0% { transform: translateY(-30px); opacity:1; }
  100% { transform: translateY(110vh); opacity:0; }
}
</style>
</head>
<body>

<div class="table">
  <div class="bouquet" id="bouquet">
    <!-- 100 roses CSS -->
    <script>
      for(let i=0;i<100;i++){
        const r=document.createElement("span");
        document.getElementById("bouquet").appendChild(r);
      }
    </script>
    <div class="enveloppe" id="env">📩</div>
  </div>
</div>

<div class="lettre" id="lettre">
  💌 Mon amour…<br><br>
  Si tu es là, c’est que tu comptes énormément pour moi ❤️<br>
  Tu me manques beaucoup, et je suis désolé pour toutes les fois où je t’ai blessée…<br>
  Je tiens à toi plus que tu ne l’imagines.<br><br>
  <strong>Je t’aime fort. ❤️ — Erkheli</strong><br><br>
  <button onclick="closeLettre()" class="btn">Fermer 💕</button>
</div>

<script>
const env=document.getElementById("env");
const lettre=document.getElementById("lettre");

env.onclick=function(){
  lettre.classList.add("show");
  // Lancer pluie de cœurs
  for(let i=0;i<30;i++){
    const h=document.createElement("div");
    h.className="heart";
    h.textContent="💖";
    h.style.left=Math.random()*100+"vw";
    h.style.animationDuration=(3+Math.random()*2)+"s";
    document.body.appendChild(h);
    setTimeout(()=>{h.remove()},5000);
  }
}

function closeLettre(){ lettre.classList.remove("show"); }
</script>

</body>
</html>
