<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pour toi ❤️</title>

<style>
:root{
  --rose:#ff4d88;
}

/* ===== FOND ===== */
body{
  margin:0;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:radial-gradient(circle at top,#2b0018,#000);
  font-family:'Georgia', serif;
  overflow:hidden;
  color:white;
  text-align:center;
}

/* étoiles */
.star{
  position:fixed;
  width:2px;
  height:2px;
  background:white;
  border-radius:50%;
  animation:twinkle 2s infinite alternate;
}
@keyframes twinkle{
  from{opacity:.2}
  to{opacity:1}
}

/* coeur */
.heart{
  font-size:120px;
  cursor:pointer;
  animation:beat 1s infinite;
  filter:drop-shadow(0 0 25px var(--rose));
}
@keyframes beat{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.15)}
}

/* texte */
.tap{
  margin-top:10px;
  font-size:20px;
  color:#ffd6e7;
}

/* lettre */
.letter{
  position:absolute;
  left:50%;
  transform:translate(-50%,40px) scale(.9);
  width:90vw;
  max-width:480px;
  background:linear-gradient(180deg,#fff8dc,#ffe4b5);
  color:#5a0033;
  border-radius:22px;
  padding:30px;
  line-height:1.7;
  box-shadow:0 0 50px rgba(255,215,0,.5);
  opacity:0;
  transition:.8s cubic-bezier(.2,.8,.2,1);
}

.letter.show{
  opacity:1;
  transform:translate(-50%,-40px) scale(1);
}

/* pluie */
.flower{
  position:fixed;
  top:-30px;
  animation:fall linear forwards;
  font-size:22px;
}
@keyframes fall{
  to{
    transform:translateY(110vh) rotate(360deg);
    opacity:0;
  }
}

/* explosion */
.burst{
  position:fixed;
  font-size:24px;
  animation:burstAnim 1s forwards;
}
@keyframes burstAnim{
  to{
    transform:translate(var(--x),var(--y)) scale(0);
    opacity:0;
  }
}

/* easter egg caché */
.secret{
  position:fixed;
  bottom:5px;
  right:8px;
  opacity:.15;
  font-size:12px;
  cursor:pointer;
}
.secret:hover{opacity:.6;}
</style>
</head>

<body>

<div class="scene">
  <div class="heart" onclick="openLetter()">❤️</div>
  <div class="tap">Appuie sur mon cœur… 💖</div>

  <div class="letter" id="letter">
    Mon amour ❤️<br><br>

    Depuis que tu es entrée dans ma vie,  
    tout est devenu plus beau…  

    Je suis sincèrement désolé pour  
    toutes les fois où j’ai pu te blesser.  

    Mais une chose ne changera jamais :  
    <b>tu comptes énormément pour moi.</b>  

    Tu me manques chaque jour…  
    et je t’aime très fort. 💕
  </div>
</div>

<!-- easter egg -->
<div class="secret" onclick="secretMsg()">✨</div>

<!-- musique romantique -->
<audio id="music" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<script>

/* ===== ouverture ===== */
function openLetter(){
  document.getElementById("letter").classList.add("show");

  // musique (marche après interaction)
  document.getElementById("music").play().catch(()=>{});

  // explosion de coeurs
  for(let i=0;i<18;i++){
    const b=document.createElement("div");
    b.className="burst";
    b.innerHTML=["💖","💕","💘","💗"][Math.floor(Math.random()*4)];
    b.style.left="50vw";
    b.style.top="50vh";
    b.style.setProperty("--x",(Math.random()*400-200)+"px");
    b.style.setProperty("--y",(Math.random()*400-200)+"px");
    document.body.appendChild(b);
    setTimeout(()=>b.remove(),1000);
  }
}

/* ===== étoiles ===== */
for(let i=0;i<70;i++){
  const s=document.createElement("div");
  s.className="star";
  s.style.left=Math.random()*100+"vw";
  s.style.top=Math.random()*100+"vh";
  s.style.animationDuration=(1+Math.random()*2)+"s";
  document.body.appendChild(s);
}

/* ===== pluie love ===== */
setInterval(()=>{
  const items=["🌹","🌸","💖","💕","🌺"];
  const el=document.createElement("div");
  el.className="flower";
  el.innerHTML=items[Math.floor(Math.random()*items.length)];
  el.style.left=Math.random()*100+"vw";
  el.style.animationDuration=(5+Math.random()*4)+"s";
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),9000);
},400);

/* ===== easter egg ===== */
function secretMsg(){
  alert("😏 Petit secret… Je t’aime encore plus que tu ne le crois ❤️");
}

</script>

</body>
</html>
