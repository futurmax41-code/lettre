<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💖 Pour toi 💖</title>
<style>
body{margin:0;height:100vh;display:flex;justify-content:center;align-items:center;text-align:center;font-family:'Comic Sans MS', cursive;
background: radial-gradient(circle,#ff99cc,#ff66aa);}
.table{position:relative;width:90%;height:70%;background:#b88; border-radius:15px; box-shadow:0 0 50px #000; display:flex; justify-content:center; align-items:center;}
.bouquet{position:absolute;width:120px;height:120px; background:url('https://i.ibb.co/5RYQY8h/roses.png') no-repeat center/cover; cursor:grab; user-select:none;}
.bouquet span{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:60px;color:#ffd700;font-weight:bold;}
.enveloppe{position:absolute;width:40px;height:25px;background:white; border:2px solid #fff; border-radius:4px; top:10px; left:40%; cursor:pointer; display:flex; justify-content:center; align-items:center;}
.lettre{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);color:white;display:none;justify-content:center;align-items:center;text-align:center;font-size:18px;padding:20px;}
</style>
</head>
<body>

<div class="table" id="table">
  <div class="bouquet" id="bouquet">
    <span>L</span>
    <div class="enveloppe" id="env">📩</div>
  </div>
</div>

<div class="lettre" id="lettre">
  💌 Mon amour… <br><br>
  Si tu es là, c’est que tu comptes énormément pour moi ❤️<br>
  Tu me manques beaucoup, et je suis désolé pour toutes les fois où je t’ai blessée…<br>
  Je tiens à toi plus que tu ne l’imagines.<br><br>
  <strong>Je t’aime fort. ❤️ — Erkheli</strong><br><br>
  <button class="btn" onclick="closeLettre()">Fermer 💕</button>
</div>

<script>
// Drag & drop bouquet
const bouquet=document.getElementById("bouquet");
let offsetX=0, offsetY=0, dragging=false;
bouquet.addEventListener('mousedown', e=>{
  dragging=true;
  offsetX=e.clientX - bouquet.offsetLeft;
  offsetY=e.clientY - bouquet.offsetTop;
});
document.addEventListener('mousemove', e=>{
  if(dragging){
    bouquet.style.left=(e.clientX - offsetX)+"px";
    bouquet.style.top=(e.clientY - offsetY)+"px";
  }
});
document.addEventListener('mouseup', e=>{ dragging=false; });

// Enveloppe cliquable
document.getElementById("env").onclick=function(){
  document.getElementById("lettre").style.display="flex";
};
function closeLettre(){ document.getElementById("lettre").style.display="none"; }
</script>
</body>
</html>
