<!DOCTYPE html>
<html lang="fr">
<head>

<title>Pour toi ❤️</title>

<style>

@keyframes fade{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1; transform:translateY(0);}
}
</style>
</head>
<body>

<div class="box">
  <h1>💌 Mon amour…</h1>
  <p>
  Si tu es arrivée jusqu’ici…<br><br>
  c’est que tu comptes énormément pour moi  ❤️<br><br>
  Tu me manques beaucoup ON VA DIRE et je suis désolé<br>
  pour toutes les fois où je t’ai blessé MBB 💔<br><br>
  Je tiens à toi plus que tu ne l’imagines.<br><br>
  <strong>Je t’aime fort. ❤️</strong><br><br>
  — Erkheli 💕
  </p>
</div>

</body>
</html>
