<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>💖 Surprise</title>
<style>

body{
margin:0;
height:100vh;
background: linear-gradient(135deg,#ff9ecb,#ff4d88,#ff1f6b);
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
font-family: "Georgia", serif;
color:white;
overflow:hidden;
}

/* titre */
.title{
font-size:3rem;
margin-bottom:40px;
text-shadow:0 0 20px rgba(255,255,255,0.7);
}

/* enveloppe */
.envelope{
font-size:120px;
cursor:pointer;
transition:0.4s;
}

.envelope:hover{
transform:scale(1.15) rotate(-5deg);
}

/* lettre */
.letter{
position:absolute;
bottom:-400px;
background:white;
color:#ff2e7a;
padding:30px;
width:320px;
border-radius:20px;
box-shadow:0 20px 60px rgba(0,0,0,0.3);
text-align:center;
font-size:1.2rem;
font-weight:bold;
transition:0.8s ease;
}

/* lettre visible */
.letter.show{
bottom:120px;
}

/* grand L */
.bigL{
font-size:4rem;
color:#ff2e7a;
margin-bottom:15px;
}

</style>
</head>

<body>

<h1 class="title">💖 Pour Toi 💖</h1>

<div class="envelope" onclick="openLetter()">💌</div>

<div id="letter" class="letter">
<div class="bigL">L</div>

Mon amour ❤️<br><br>

Depuis que tu es entrée dans ma vie,<br>
tout est devenu plus beau…<br><br>

Je t’aime infiniment 💖<br><br>

— Erkheli
</div>

<script>
function openLetter(){
document.getElementById("letter").classList.add("show");
}
</script>

</body>
</html>
