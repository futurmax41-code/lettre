<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Surprise mon amour 💘</title>

<style>
body{
margin:0;
height:100vh;
background: radial-gradient(circle at center,
#1a0033,
#000000);
overflow:hidden;
font-family: 'Georgia', serif;
}

/* 🌌 Trou noir romantique */
.blackhole{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:300px;
height:300px;
border-radius:50%;
background: radial-gradient(circle,
#000,
#2b004f,
#000);
box-shadow:
0 0 60px #ff4d88,
0 0 120px #9900ff;
animation: spin 20s linear infinite;
}

@keyframes spin{
from{transform:translate(-50%,-50%) rotate(0deg);}
to{transform:translate(-50%,-50%) rotate(360deg);}
}

/* 💌 enveloppe royale */
.envelope{
position:absolute;
top:55%;
left:50%;
transform:translate(-50%,-50%);
width:180px;
height:120px;
background: linear-gradient(135deg,#fff,#ffe6f2);
border-radius:12px;
cursor:pointer;
box-shadow:0 0 25px rgba(255,255,255,0.6);
display:flex;
align-items:center;
justify-content:center;
font-size:60px;
}

/* 📜 lettre */
.letter{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%) scale(0);
width:320px;
padding:30px;
background:linear-gradient(#fff,#fff0f5);
border-radius:20px;
text-align:center;
font-size:20px;
transition:0.6s;
box-shadow:0 0 40px rgba(255,255,255,0.7);
}

.letter.show{
transform:translate(-50%,-50%) scale(1);
}

/* 🌹 roses réalistes */
.rose{
position:absolute;
font-size:30px;
animation: float 6s infinite ease-in-out;
}

@keyframes float{
0%{transform:translateY(0);}
50%{transform:translateY(-20px);}
100%{transform:translateY(0);}
}

/* 💖 signature */
.signature{
font-size:32px;
color:#ff4d88;
text-shadow:0 0 15px #ff99cc;
margin-top:15px;
}
</style>
</head>

<body>

<div class="blackhole"></div>

<div class="envelope" onclick="openLetter()">
💌
</div>

<div id="letter" class="letter">
<p>
Depuis le premier regard…<br>
j’ai su que toi et moi c’était écrit. ✨
</p>

<p>
Tu es mon bonheur, ma folie,<br>
et la plus belle chose qui me soit arrivée.
</p>

<div class="signature">❤️ L ❤️</div>
</div>

<!-- 🌹 roses décor -->
<div class="rose" style="top:10%;left:15%;">🌹</div>
<div class="rose" style="top:20%;left:80%;">🌹</div>
<div class="rose" style="top:75%;left:20%;">🌹</div>
<div class="rose" style="top:85%;left:70%;">🌹</div>

<script>
function openLetter(){
document.getElementById("letter").classList.add("show");
}
</script>

</body>
</html>
